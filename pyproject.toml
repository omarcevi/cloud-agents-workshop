[project]
name = "workplace-assistant"
version = "0.1.0"
description = "Workplace Assistant for the 'Deploying Your Agents on Google Cloud' workshop"
authors = [
    {name = "Omar Elcircevi"},
]



dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics,agent-identity]>=2.12.0,<3.0.0",
    # 2.62 adds bind_id_token=False, needed to call Cloud Run with an Agent Identity ID token.
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2026.10.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
    "protobuf>=6.31.1,<7.0.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    # MCP servers run locally for tests (they deploy from mcp_servers/requirements.txt).
    "fastmcp==4.1.3",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "ruff>=0.4.6,<1.0.0",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "shellcheck-py>=0.10.0.1",
    "pre-commit>=4.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.12.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_servers", "evals"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["tests/unit"]
markers = [
    "integration: local MCP servers + real Gemini (RUN_INTEGRATION=1)",
    "e2e: a real Google Cloud project (RUN_E2E=1)",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "mcp_servers", "evals", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["^app/app_utils/", "^app/fast_api_app\\.py$"]

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


