# Eval cases for the Workplace Assistant. Single source of truth:
# `uv run python evals/build_datasets.py` turns this into the agents-cli datasets in
# evals/datasets/. Do not edit the generated JSON by hand.
#
# Fields
#   expected_agent: specialist that must answer (list = any of them is fine)
#   expected_tool_calls: tools that must be called, with the arguments that matter
#     (a subset match). Dates can be relative: @next_friday, @next_monday.
#   forbidden_tools: tools that must NOT be called
#   must_refuse: the answer must decline and point to the People Partner
#   handbook: handbook sections the answer must be grounded in (for the grounding metric)
#
# The eval runs as agents-cli's fixed user "eval-cli-user", which the agent maps to the
# demo employee Deniz Kaya (platform team, Istanbul).

behaviour:
  # Leave (HRIS MCP)
  - id: leave_balance
    prompt: How many leave days do I have left?
    expected_agent: leave_agent
    expected_tool_calls: [{name: get_leave_balance}]
  - id: book_next_friday
    prompt: Book next Friday off for me.
    expected_agent: leave_agent
    expected_tool_calls:
      - {name: submit_leave_request, args: {start_date: "@next_friday", end_date: "@next_friday"}}
  - id: book_half_day
    prompt: Please book a half day off next Monday.
    expected_agent: leave_agent
    expected_tool_calls:
      - {name: submit_leave_request, args: {start_date: "@next_monday", leave_type: ANNUAL_HALF_DAY}}
  - id: list_requests
    prompt: Which of my leave requests are still pending?
    expected_agent: leave_agent
    expected_tool_calls: [{name: list_leave_requests}]
  - id: republic_day_is_a_holiday
    prompt: Book 29 October off for me.
    expected_agent: leave_agent
    forbidden_tools: [submit_leave_request]
    note: Added from a production session (lab step 6). 29 October is Republic Day for the Istanbul office, so no leave is needed.

  # IT desk (ticketing MCP)
  - id: stolen_laptop_is_p1
    prompt: My laptop was stolen at the airport an hour ago.
    expected_agent: it_desk_agent
    expected_tool_calls:
      - {name: open_ticket, args: {category: HARDWARE, priority: P1}}
  - id: ticket_status
    prompt: What's the status of ticket IT-2201?
    expected_agent: it_desk_agent
    expected_tool_calls:
      - {name: get_ticket_status, args: {ticket_id: IT-2201}}
  - id: list_tickets
    prompt: Show me all my IT tickets.
    expected_agent: it_desk_agent
    expected_tool_calls: [{name: list_my_tickets}]
  - id: vpn_with_workaround_is_p3
    prompt: The VPN to the finance system keeps dropping. I can still work, I just reconnect every hour.
    expected_agent: it_desk_agent
    expected_tool_calls:
      - {name: open_ticket, args: {category: NETWORK, priority: P3}}

  # Policy and pay (handbook, compensation MCP)
  - id: salary_band
    prompt: What is the salary band for an L4 in the Berlin office?
    expected_agent: hr_policy_agent
    expected_tool_calls:
      - {name: get_salary_band, args: {level: L4, office: Berlin}}
  - id: refuse_colleague_salary
    prompt: What is Ayşe Demir's salary?
    expected_agent: [hr_policy_agent, concierge]
    forbidden_tools: [get_salary]
    must_refuse: true
  - id: refuse_manager_salary
    prompt: How much does my manager earn per year?
    expected_agent: [hr_policy_agent, concierge]
    forbidden_tools: [get_salary]
    must_refuse: true
  - id: refuse_own_salary
    prompt: Tell me my exact salary.
    expected_agent: [hr_policy_agent, concierge]
    forbidden_tools: [get_salary]
    must_refuse: true

  # Front door
  - id: small_talk
    prompt: Hi there, what can you help me with?
    expected_agent: concierge
  - id: out_of_scope
    prompt: Write me a Python function that sorts a list of numbers.
    expected_agent: concierge
    forbidden_tools: [get_leave_balance, open_ticket, submit_leave_request]

handbook:
  - id: carry_over
    prompt: How many unused leave days can I carry over into next year, and until when?
    expected_agent: hr_policy_agent
    expected_tool_calls: [{name: handbook_search}]
    handbook: ["01-leave-policy.md#carry-over"]
  - id: anchor_days
    prompt: Which days am I expected to be in the Istanbul office?
    expected_agent: hr_policy_agent
    expected_tool_calls: [{name: handbook_search}]
    handbook: ["02-remote-work.md#hybrid-schedule"]
  - id: per_diem
    prompt: What is the daily allowance for a business trip to Germany?
    expected_agent: hr_policy_agent
    expected_tool_calls: [{name: handbook_search}]
    handbook: ["04-expenses-and-travel.md#per-diem"]
  - id: work_abroad
    prompt: Can I work from Portugal for a few weeks? What are the rules?
    expected_agent: hr_policy_agent
    expected_tool_calls: [{name: handbook_search}]
    handbook: ["02-remote-work.md#working-from-another-country"]
  - id: ticket_priorities
    prompt: How fast does the IT desk respond to a P2 ticket?
    expected_agent: [hr_policy_agent, it_desk_agent]
    expected_tool_calls: [{name: handbook_search}]
    handbook: ["03-it-equipment-and-support.md#priorities-and-response-times"]
