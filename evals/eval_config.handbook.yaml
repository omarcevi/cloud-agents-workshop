# Metrics for evals/datasets/handbook.json. `grounding` is a built-in LLM-judge metric
# from the Gen AI evaluation service: it checks the answer against each case's
# `context` (the handbook passages), so it needs a Google Cloud project.
metrics_to_run:
  - grounding
  - routed_to_expected_agent
  - tool_trajectory
custom_metrics:
  - name: routed_to_expected_agent
    custom_function_file: metrics/routing.py
  - name: tool_trajectory
    custom_function_file: metrics/trajectory.py
